<nav class="flex flex-col items-center gap-3 w-full">
  <!-- Logo -->
  <div class="flex flex-col items-center gap-1 text-center" pTooltip="WorldPinball Supervisor">
    <i
      [class]="'pi pi-wave-pulse'+' !text-2xl text-red-500 animate-pulse drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]' "></i>
    <h1
      class="text-[10px] font-medium tracking-tight text-align-center items-center text-surface-700 dark:text-surface-200">
      WorldPinball Supervisor
    </h1>
  </div>

  <p-divider />
  @for (item of navItems(); track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="bg-surface-200 dark:bg-surface-800 text-surface-900 dark:text-white shadow-sm"

      class="flex items-center justify-center w-12 h-12 rounded-2xl text-surface-500 dark:text-surface-400 hover:bg-surface-100 dark:hover:bg-surface-800 hover:text-surface-900 dark:hover:text-surface-100 transition-all text-2xl"
      [pTooltip]="item.label"
    >
      <i [class]="item.icon + ' !text-xl'"></i>
    </a>
  }

</nav>
