<footer class="flex flex-col items-center gap-3 w-full">
  <!-- Button Dark/Light mode -->
  <div>
    <button
      (click)="themeService.toggleThemeDarkLightMode()"
      type="button"
      class="text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors p-2 cursor-pointer"
      [pTooltip]="themeService.isDarkMode() ? 'Mode clair' : 'Mode sombre'"
    >
      <i [class]="themeService.isDarkMode() ? 'pi pi-sun !text-2xl text-amber-400' : 'pi pi-moon !text-2xl text-indigo-400'"></i>
    </button>
  </div>

  <!-- Avatar -->
  <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-slate-300 dark:border-slate-700 hover:border-slate-500 cursor-pointer transition-all">
    <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" size="large" shape="circle" />
  </div>
  <span class="text-[10px] font-medium tracking-tight text-center text-slate-500 dark:text-slate-400">Utilisateur</span>
  <p-divider class="w-full px-2" />
  <!-- Parameter Icon -->
  <a routerLink="/settings" class="text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors p-2"
     pTooltip="Paramètres">
    <i class="pi pi-cog !text-2xl"></i>
  </a>
</footer>
