<div class="flex h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 p-4 gap-4 justify-center transition-colors">

  <!-- container -->
  <div class="flex w-full max-w-[1440px] h-full max-h-[950px] gap-4">

  <!-- Sidebar -->
    <aside
      class="w-20 h-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl py-6 flex flex-col items-center justify-between transition-colors shadow-sm dark:shadow-none">

      <nav class="flex flex-col items-center gap-3 w-full">
        <!-- Logo -->
        <div class="flex flex-col items-center gap-1 text-center" pTooltip="WorldPinball Supervisor">
          <i [class]="'pi pi-wave-pulse'+' !text-2xl text-red-500 animate-pulse drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]' "></i>
          <h1 class="text-[10px] font-medium tracking-tight text-align-center items-center text-slate-700 dark:text-slate-200">
            WorldPinball Supervisor
          </h1>
        </div>

        <p-divider/>
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"

            class="flex items-center justify-center w-12 h-12 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100 transition-all text-2xl"
            [pTooltip]="item.label"
          >
            <i [class]="item.icon + ' !text-xl'"></i>
          </a>
        }
      </nav>
      <nav class="flex flex-col items-center gap-3 w-full">


        <footer class="flex flex-col items-center gap-3 w-full">
          <!-- Bouton Dark/Light mode -->
          <div>
            <button
              (click)="themeService.toggleThemeDarkLightMode()"
              type="button"
              class="text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors p-2 cursor-pointer"
              [pTooltip]="themeService.isDarkMode() ? 'Mode clair' : 'Mode sombre'"
            >
              <i [class]="themeService.isDarkMode() ? 'pi pi-sun !text-2xl text-amber-400' : 'pi pi-moon !text-2xl text-indigo-400'"></i>
            </button>
          </div>

          <!-- Avatar utilisateur -->
          <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-slate-300 dark:border-slate-700 hover:border-slate-500 cursor-pointer transition-all">
            <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" size="large" shape="circle" />
          </div>
          <span class="text-[10px] font-medium tracking-tight text-center text-slate-500 dark:text-slate-400">Utilisateur</span>
          <p-divider class="w-full px-2" />
          <!-- Icône Paramètres -->
          <a routerLink="/settings" class="text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors p-2"
             pTooltip="Paramètres">
            <i class="pi pi-cog !text-2xl"></i>
          </a>
        </footer>
      </nav>
    </aside>

    <!-- main content -->
    <main class="flex-1 bg-white/80 dark:bg-slate-900/25 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 overflow-y-auto transition-colors shadow-sm dark:shadow-none">
      <router-outlet/>
    </main>
  </div>
</div>
