<div
  class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-white dark:bg-surface-900/60 border border-surface-200 dark:border-surface-800 rounded-2xl p-5 shadow-sm dark:shadow-none">

  <!-- FILTER-->
  <app-fieldset-card title="Filtre">
    <button

      class="w-full flex justify-center items-center gap-2 bg-primary-500 hover:bg-primary-400 text-white p-2.5 rounded-lg">
      <i class="pi pi-filter"></i>
      <span>Filtre (options avancées)</span>
    </button>
    <p-divider />
    <div class="flex flex-row gap-2">


      <div
        class="flex p-1 bg-surface-100 dark:bg-surface-950 rounded-xl border border-surface-200 dark:border-surface-800 gap-1 w-full">

        <!-- Bouton Liste -->
        <button
          type="button"
          (click)="toggleView('LIST')"
          class="flex-1 flex justify-center items-center gap-2 py-2 rounded-lg text-xs font-semibold transition-all cursor-pointer"
          [class]="viewMode() === 'LIST'
          ? 'bg-primary-500 text-white shadow-sm'
          : 'text-surface-600 dark:text-surface-400 hover:text-surface-900 dark:hover:text-white'">
          <i class="pi pi-list"></i>
          Vue liste
        </button>

        <!-- Bouton Licences -->
        <button
          type="button"
          (click)="toggleView('IP')"
          class="flex-1 flex justify-center items-center gap-2 py-2 rounded-lg text-xs font-semibold transition-all cursor-pointer"
          [class]="viewMode() === 'IP'
          ? 'bg-primary-500 text-white shadow-sm'
          : 'text-surface-600 dark:text-surface-400 hover:text-surface-900 dark:hover:text-white'">
          <i class="pi pi-table"></i>
          Vue licences
        </button>

      </div>
    </div>
  </app-fieldset-card>

  <!-- RESEARCH -->
  <app-fieldset-card title="Rechercher">
    <div class="flex flex-col gap-3 h-full">
      <input
        type="text"
        placeholder="Rechercher..."
        class="w-full border border-surface-300
        dark:border-surface-700
        bg-surface-50 dark:bg-surface-900 rounded-lg
         p-2 text-surface-900 dark:text-white"
      />
      <button
        pButton
        type="button"
        class="w-full flex justify-center items-center gap-2">
        <i class="pi pi-search mr-2"></i>
        Rechercher
      </button>
    </div>
  </app-fieldset-card>

  <!-- ALL MACHINES -->
  <app-fieldset-card title="Total Machines">
    <div class="flex flex-col gap-1.5 text-sm">

      <!-- Online : En vert lumineux -->
      <div class="flex justify-between items-center">
        <span class="text-surface-600 dark:text-surface-300">Online</span>
        <span class="font-semibold text-emerald-500 dark:text-emerald-400">8</span>
      </div>

      <!-- Offline : Neutre, discret sans attirer l'œil -->
      <div class="flex justify-between items-center">
        <span class="text-surface-600 dark:text-surface-300">Offline</span>
        <span class="font-medium text-surface-400">12</span>
      </div>

      <!-- Pending : En jaune / ambre -->
      <div class="flex justify-between items-center">
        <span class="text-surface-600 dark:text-surface-300">Pending to enroll</span>
        <span class="font-semibold text-amber-500 dark:text-amber-400">3</span>
      </div>

      <!-- Séparateur resserré -->
      <p-divider type="dashed" styleClass="!my-1.5 border-surface-200 dark:border-surface-800" />

      <!-- Total : Bien visible pour conclure -->
      <div class="flex justify-between items-center">
        <span class="font-semibold text-surface-900 dark:text-white">Totalité du parc</span>
        <span class="font-bold text-surface-900 dark:text-white">23</span>
      </div>

    </div>
  </app-fieldset-card>

</div>
