<header class="flex items-center justify-between">
  <div class="flex items-center gap-4">
    <a
      routerLink="/machines"
      class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors cursor-pointer inline-flex items-center justify-center border border-slate-200 dark:border-transparent"
      title="Retour aux catégories"
    >
      <i class="pi pi-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">{{ selectedModel()?.name }}</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">{{ selectedModel()?.manufacturer }}
        • {{ selectedModel()?.year }}</p>
    </div>
  </div>
</header>
