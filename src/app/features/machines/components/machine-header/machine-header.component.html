<header class="flex items-center justify-between">
  <div class="flex items-center gap-4">
    <a
      routerLink="/machines"
      class="p-2.5 rounded-xl bg-surface-100 dark:bg-surface-800 hover:bg-surface-200 dark:hover:bg-surface-700 text-surface-700 dark:text-surface-300 hover:text-surface-900 dark:hover:text-white transition-colors cursor-pointer inline-flex items-center justify-center border border-surface-200 dark:border-transparent"
      title="Retour aux catégories"
    >
      <i class="pi pi-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-surface-900 dark:text-white tracking-tight">{{ selectedModel()?.name }}</h1>
      <p class="text-sm text-surface-500 dark:text-surface-400">{{ selectedModel()?.manufacturer }}
        • {{ selectedModel()?.year }}</p>
    </div>
  </div>
</header>
