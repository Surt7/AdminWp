<div class="flex items-center gap-3">
  <!-- 1. Le Badge coloré avec @switch -->
  @switch (currentUnit().status) {
    @case ('ONLINE') {
      <span
        class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                ● En ligne
              </span>
    }
    @case ('IN_GAME') {
      <span
        class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20">
                🎮 En partie
              </span>
    }
    @case ('MAINTENANCE') {
      <span
        class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
                ⚠️ Maintenance
              </span>
    }
    @case ('OFFLINE') {
      <span
        class="px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20">
                ○ Hors ligne
              </span>
    }
  }
  <!-- 2. Les 4 boutons de changement de statut -->
  <div
    class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl border border-slate-200 dark:border-slate-700/60">
    <button
      (click)="changeStatus( 'ONLINE')"
      pTooltip="Passer En Ligne"
      class="w-7 h-7 rounded-lg flex items-center justify-center text-xs hover:bg-emerald-500/20 transition-colors cursor-pointer"
    >
      🟢
    </button>
    <button
      (click)="changeStatus('IN_GAME')"
      pTooltip="Passer En Partie"
      class="w-7 h-7 rounded-lg flex items-center justify-center text-xs hover:bg-indigo-500/20 transition-colors cursor-pointer"
    >
      🎮
    </button>
    <button
      (click)="changeStatus('MAINTENANCE')"
      pTooltip="Mettre en Maintenance"
      class="w-7 h-7 rounded-lg flex items-center justify-center text-xs hover:bg-amber-500/20 transition-colors cursor-pointer"
    >
      🟡
    </button>
    <button
      (click)="changeStatus( 'OFFLINE')"
      pTooltip="Passer Hors Ligne"
      class="w-7 h-7 rounded-lg flex items-center justify-center text-xs hover:bg-rose-500/20 transition-colors cursor-pointer"
    >
      🔴
    </button>
  </div>
</div>
