<div class="min-h-screen w-full flex items-center justify-center bg-surface-950 p-4">
  <p-card
    class="max-w-sm w-full"
    header="WorldPinball Admin"
    subheader="Authentification sécurisée par SSO d'entreprise">

    <!-- Security Notice / Description -->
    <div
      class="my-4 flex flex-col items-center justify-center gap-3 text-center py-4 bg-surface-900/50 rounded-xl border border-surface-800">
      <i class="pi pi-shield text-3xl text-primary-400"></i>
      <p class="text-xs text-surface-400 px-4">
        Connexion déléguée OpenID Connect. Vos identifiants sont vérifiés directement par Keycloak.
      </p>
    </div>
    <!-- Actions -->
    <ng-template #footer>
      <div class="flex flex-col gap-3">
        <!-- Direct SSO Button -->
        <button
          (click)="onLogin()"
          type="button"
          pButton
          icon="pi pi-sign-in"
          label="Se connecter via Keycloak (SSO)"
          class="w-full">
        </button>
        <p class="text-center text-surface-500 text-xs mt-2">
          Accès réservé aux administrateurs et techniciens agréés.
        </p>
      </div>
    </ng-template>
  </p-card>
</div>
